  boothIntro: Two decks, Digital Krux sets and the Meebits album. One plays at a time.
  deckSets: Digital Krux
  deckSetsIntro: Ten years of my sets. Press play on one and the city switches to DJ mode. Press it again to stop.
  deckAlbum: Turn On, the Meebits album
  deckAlbumIntro: The record the rest of the site hums along to. Pick a track, or let it run from the top with Space.
  posesIntro: Every move the Meebit knows, from the same crate meeb.cam uses. Pick one and it plays on the character; pick it again, or leave the world, and the Meebit goes back to choosing for itself. Click the character to try the next one in that group.
  meebitIntro: Four Meebits, one stage. Pick who stands on it; M cycles through them from anywhere.
