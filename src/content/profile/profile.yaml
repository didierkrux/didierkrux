name: Didier Krux
headline: Fullstack web3 developer. DJ after midnight.
resumeHeadline: Fullstack Web3 Developer
resumeSummary: "Fullstack web3 developer with 20 years of shipping: French newspapers read by millions, startups in Hong Kong, and since 2021 Ethereum. Builds the products that onboard people into Ethereum: event apps, learning platforms, and the tools behind them."
bio: |
  gm. I'm Didier, a fullstack web3 developer with 20 years of shipping: French newspapers read by millions every day, startups in Hong Kong, and since 2021 Ethereum.

  Today I build the Devcon website and event app for the Ethereum Foundation, and I lead development at Bankless Academy, a free education platform that walks newcomers into web3 one lesson at a time.

  When the laptop closes I dance or DJ, as Digital Krux.
