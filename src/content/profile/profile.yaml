personal:
  - INFJ, the Advocate type. I care about why we build something before how.
  - Growth mindset. I keep learning and keep improving what I ship.
  - Flexible and adaptive. New challenges are fine, and I take ownership of them.
  - Creative. I like to think outside the box and try the unusual route first.
  - Clear communicator and team player. Happy to learn from others and to mentor junior developers.
  - Attentive to details. I build interfaces and experiences that spark joy.
