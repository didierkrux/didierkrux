name: Didier Krux
headline: Fullstack web3 developer. DJ after midnight.
resumeHeadline: Fullstack Web3 Developer
bio: |
  gm. I'm Didier, a fullstack web3 developer with 20 years of shipping: first for French newspapers read by millions every day, then for startups in Hong Kong, and since 2021 for Ethereum.

  Today I build devcon.org, devconnect.org, and the Devcon event app for the Ethereum Foundation, and I lead development at Bankless Academy, a free education platform that walks newcomers into web3 one lesson at a time.

  When the laptop closes I play records. Digital Krux is the name on the decks.
