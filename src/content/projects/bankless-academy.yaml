story: |
  Bankless Academy teaches Ethereum, DeFi, NFTs, and DAOs through short lessons and hands-on quests, free and open source, in 28 languages. Lessons live as Markdown in the repository and compile at build time; translations are generated by AI against the English source and re-run only for what changed.

  Learners sign in with Ethereum and bring their identity along: ENS, Basenames, EFP, Farcaster. Quests make you actually do the thing: bridge, swap on a DEX, cast an onchain vote. Badges are NFTs on Base, minted gasless through a smart wallet and paymaster, with proof of personhood from Human Passport keeping bots out. An indexer tracks progress inside and outside the Academy, and every learner gets dynamic social images with their score.

  Around the core: a Farcaster mini app and a React SDK that embed lessons anywhere, a white-label version for partners, lessons co-built with 1inch, Optimism, Velodrome, Gitcoin, Zerion, and Rocket Pool, and an AI assistant on Discord, Telegram, and X that answers crypto questions with a link to the right lesson.
