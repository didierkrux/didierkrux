story: |
  The Devcon and Devconnect websites and the interactive event app: a web app attendees install on their phone for the schedule, the map, and what is happening right now.

  The app ran the Devconnect World Fair in Buenos Aires in November 2025, a week of real Ethereum applications for real people, with in-person crypto payments across the venue. Since 2026, tickets can be bought onchain through the pretix Ethereum payment plugin.

  The quiet part of the job is adoption: helping the Argentine community and the wider ecosystem use Ethereum for things people actually need.
