story: |
  I build and maintain devcon.org, devconnect.org, and the interactive event app, an installable PWA attendees carry around the venue for the schedule, the map, and what is happening right now.

  In November 2025 the app ran the Devconnect World Fair in Buenos Aires, a week of showing real Ethereum applications to real people. Next up is a new event and a new edition of the app for Mumbai, with tickets paid in crypto through the pretix Ethereum payment plugin.

  The quiet part of the job is adoption work: helping the Argentine community and the wider ecosystem use Ethereum for things people actually need.
