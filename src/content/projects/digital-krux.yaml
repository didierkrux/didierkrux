story: |
  Digital Krux is my DJ alias: seventy podcasts and live sets between 2007 and 2017, from Karnakut parties to Miami. The site started as a WordPress blog synced to iTunes, and in 2025 I rebuilt it as a Vue player with a canvas grid that lights up to the music. The same sets play in the Music channel here.
resume: DJ podcast with seventy sets and an audio-reactive Vue player, RSS feed included.
