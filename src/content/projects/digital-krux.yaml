story: |
  Digital Krux is my DJ alias: seventy podcasts and live sets between 2007 and 2017, from Karnakut parties to Miami. Once a WordPress blog synced to iTunes, since 2025 a Vue player with a canvas grid that lights up to the music. The same sets play in the DJ booth here.
