story: |
  EthPage reads your ENS records and turns them into a link-in-bio page: avatar, header, bio, socials, and your links, served from IPFS at yourname.eth.limo. Change a record on ENS and the page updates. No backend, no analytics, no API keys.

  The twist is onchain recommendations. Visitors sign an EAS attestation on Base for a few cents, and it becomes public only when you follow the author on EFP. Follow is the moderation. Fork the repo, edit one config file, pin, and you have your own.
resume: Open-source ENS profile page served from IPFS, with EAS recommendations gated by EFP follows.
