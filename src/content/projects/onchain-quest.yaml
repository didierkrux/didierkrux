story: |
  NewToWeb3, November 2024, was an event for people who had never touched Ethereum, organized with OrnellaWeb3. Its app, built in six weeks: program, sponsors, and hands-on quests to get your first crypto, mint a POAP and an NFT, claim an ENS on Base, and swap a token. Multilingual, because the room was.

  It grew into Onchain Quest, a white-label event platform: wallet login, profiles, quests with points, QR booth check-ins, leaderboards, ENS subnames via Durin, EFP follows, EAS attestations, Zupass ticket proofs, a Farcaster mini app, and an onchain shop. It has since run at EthCC.
