summary: Free, open-source education platform onboarding people into Ethereum, lesson by lesson, quest by quest.
highlights:
  - Lessons as open-source Markdown compiled at build time; AI translations in 28 languages, re-run only for what changed.
  - "Onchain quests verified server-side: bridging, a DEX swap, an onchain vote."
  - NFT badges on Base, gasless through a smart wallet and paymaster, sybil-resistant with Human Passport.
  - Sign in with Ethereum with ENS, Basenames, EFP, and Farcaster profiles; a Farcaster mini app and a React SDK to embed lessons anywhere.
  - Progress indexer across lessons and outside achievements; dynamic social images per learner.
  - White-label version for partners; lessons built with 1inch, Optimism, Velodrome, Gitcoin, Zerion, and Rocket Pool.
  - AI assistant on Discord, Telegram, and X that answers crypto questions and points to the right lesson.
